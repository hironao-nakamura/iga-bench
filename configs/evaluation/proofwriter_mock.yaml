schema_path: schema/parquet_schema_contract.yaml
output_root: outputs/eval_runs/proofwriter_mock
companion_root: outputs/eval_runs/proofwriter_mock_companion
raw_companion: true
benchmark:
  loader: proofwriter_normalized_jsonl
  benchmark_id: proofwriter_tiny
  benchmark_name: ProofWriter (tiny normalized smoke fixture)
  benchmark_version: tiny-v1
  benchmark_family: semi_formal
  source_url: https://allenai.org/data/proofwriter
  upstream_license_status: CC BY 4.0
  # Tiny smoke fixture used by the mock evaluation harness so it can run
  # without requiring the 300-problem release file.  Not part of the
  # v1.1 release; the primary evaluation path uses
  # configs/evaluation/proofwriter300_*.yaml against
  # examples/current_release/proofwriter_cwa_d3_is_300.jsonl.
  input_path: examples/tiny/proofwriter_tiny.jsonl
  split: analysis
  release_tier: public_core
  include_benchmark_text_in_core: false
  supports_extension_modes: true
  notes: mock evaluation on a normalized ProofWriter-style sample.
model:
  provider: mock
  model_id: mock_proofwriter
  provider_name: mock
  model_family: mock
  model_name: mock-prontoqa-reasoner
  model_snapshot: local
  access_type: local
  trace_mode: forced_step_atomic_v2
  temperature: 0.0
  max_tokens: 1200
  notes: Deterministic symbolic subset-test provider used for ProofWriter sample.
run:
  config_id: proofwriter_mock_v1
  max_problems: 4
  repetitions: 1
  probe_bundle_id: semantic_local_surface_null_entity_v1
  probe_types:
  - semantic_substitution
  - local_substitution
  - surface_control
  - null_probe
  - entity_substitution
  dependency_modes:
  - direct
  - transitive
  include_extension_scope_predicate_determining: true
  prompt_mode: forced_step_atomic_v2
  null_probe_enabled: true
  self_consistency:
    enabled: false
    samples: 5
    temperature: 0.7
