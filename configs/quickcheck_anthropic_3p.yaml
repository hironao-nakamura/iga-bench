schema_path: schema/parquet_schema_contract.yaml
output_root: outputs/quickcheck_anthropic_3p
companion_root: outputs/quickcheck_anthropic_3p_companion
raw_companion: true

benchmark:
  loader: generic_jsonl
  benchmark_id: prontoqa_iclr50
  benchmark_name: ProntoQA (ICLR WS bootstrap)
  benchmark_version: iclr-ws-2026-bootstrap
  benchmark_family: synthetic_formal
  source_url: https://openreview.net/forum?id=qFVVBzXxR2V
  upstream_license_status: Apache-2.0
  input_path: examples/tiny/prontoqa_tiny.jsonl
  split: analysis
  release_tier: public_core
  include_benchmark_text_in_core: false
  supports_extension_modes: true
  notes: Quick check test - 3 problems, claude-sonnet-4-6

model:
  provider: anthropic
  api_key_env: ANTHROPIC_API_KEY
  model_id: anthropic_claude_sonnet_4_6_quickcheck
  provider_name: anthropic
  model_family: anthropic
  model_name: claude-sonnet-4-6
  model_snapshot: null
  access_type: api
  trace_mode: forced_step
  temperature: 0.0
  max_tokens: 1200
  notes: Quick check test run

run:
  config_id: quickcheck_forcedstep_v1
  max_problems: 3
  repetitions: 1
  probe_bundle_id: semantic_local_surface_null_v1
  probe_types: [semantic_substitution, local_substitution, surface_control, null_probe]
  dependency_modes: [direct, transitive]
  include_extension_scope_predicate_determining: true
  prompt_mode: forced_step
  null_probe_enabled: true
  self_consistency:
    enabled: false
    samples: 5
    temperature: 0.7
