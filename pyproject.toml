[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iga-suite"
version = "0.3.0"
description = "Evaluation implementation for IGA-Bench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "pandas>=2.0",
  "pyarrow>=16.0",
  "openai>=1.30.0",
  "anthropic>=0.34.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
iga-suite = "iga_suite.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive", ".git", "release", "build"]
